 "tosu_dep": "23:09", "kurume_arr": "23:17", "travel_time": 57, "is_transfer": false, "transfer_info": "直通", "type_category": "普通", "type_badge": "普通", "note": "久留米行", "days": "毎日運転", "type_class": "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border border-slate-300 dark:border-slate-700", "summary_note": "直通 (久留米行)", "time_band": "night"}, {"no": 45, "origin": "小倉", "dest": "荒尾", "hakata_dep": "22:54", "tosu_arr": "23:33", "tosu_dep": "23:34", "kurume_arr": "23:41", "travel_time": 47, "is_transfer": false, "transfer_info": "直通", "type_category": "区間快速", "type_badge": "区間快速", "note": "荒尾行 (二日市から各駅停車)", "days": "毎日運転", "type_class": "bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 border border-amber-300 dark:border-amber-700", "summary_note": "直通 (二日市から各駅停車)", "time_band": "night"}, {"no": 46, "origin": "門司港", "dest": "久留米", "hakata_dep": "23:16", "tosu_arr": "00:02", "tosu_dep": "00:03", "kurume_arr": "00:10", "travel_time": 54, "is_transfer": false, "transfer_info": "直通", "type_category": "普通", "type_badge": "普通", "note": "久留米行", "days": "毎日運転", "type_class": "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border border-slate-300 dark:border-slate-700", "summary_note": "直通 (久留米行)", "time_band": "night"}, {"no": 47, "origin": "小倉", "dest": "久留米", "hakata_dep": "23:46", "tosu_arr": "00:27", "tosu_dep": "00:28", "kurume_arr": "00:36", "travel_time": 50, "is_transfer": false, "transfer_info": "直通", "type_category": "普通", "type_badge": "普通", "note": "久留米行", "days": "毎日運転", "type_class": "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border border-slate-300 dark:border-slate-700", "summary_note": "直通 (久留米行)", "time_band": "night"}];

    let activeBand = 'day';
    let isRapidFilter = false;
    let selectedTrainNo = null;

    function detectBand() {
      const h = new Date().getHours();
      if (h >= 5 && h < 10) return 'morning';
      if (h >= 10 && h < 16) return 'day';
      if (h >= 16 && h < 20) return 'evening';
      return 'night';
    }

    function changeBand(band) {
      activeBand = band;
      selectedTrainNo = null;
      render();
    }

    function toggleRapidFilter() {
      isRapidFilter = !isRapidFilter;
      selectedTrainNo = null;
      const btn = document.getElementById('rapidToggle');
      const label = document.getElementById('rapidToggleLabel');
      if (isRapidFilter) {
        btn.classList.add('bg-red-600', 'text-white', 'border-red-500');
        btn.classList.remove('bg-zinc-950', 'text-white');
        label.innerText = '快速中';
      } else {
        btn.classList.remove('bg-red-600', 'text-white', 'border-red-500');
        btn.classList.add('bg-zinc-950', 'text-white');
        label.innerText = '快速のみ';
      }
      render();
    }

    function toggleRow(no) {
      selectedTrainNo = (selectedTrainNo === no) ? null : no;
      render();
    }

    function getNowMinutes() {
      const now = new Date();
      return now.getHours() * 60 + now.getMinutes();
    }

    function parseMin(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return (h < 4 ? h + 24 : h) * 60 + m;
    }

    function render() {
      // Update Tab Styles (PCレスポンシブ対応)
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.band === activeBand) {
          btn.className = 'tab-btn tab-active flex-1 min-w-[54px] md:min-w-[76px] py-1.5 md:py-2 px-1 md:px-2.5 rounded-lg md:rounded-xl text-center transition font-bold text-[11px] md:text-sm lg:text-base cursor-pointer';
        } else {
          btn.className = 'tab-btn flex-1 min-w-[54px] md:min-w-[76px] py-1.5 md:py-2 px-1 md:px-2.5 rounded-lg md:rounded-xl text-center transition font-semibold text-[11px] md:text-sm lg:text-base text-zinc-400 hover:text-white hover:bg-zinc-800 border border-transparent cursor-pointer';
        }
      });

      let items = TRAINS;

      // Filter by Rapid
      if (isRapidFilter) {
        items = items.filter(t => t.type_badge === '快速' || t.type_badge === '区間快速');
      }

      // Filter by Band
      const nowMin = getNowMinutes();
      if (activeBand === 'now') {
        const afterNow = items.filter(t => parseMin(t.hakata_dep) >= nowMin);
        items = afterNow.length >= 6 ? afterNow.slice(0, 10) : items.slice(0, 10);
      } else if (activeBand !== 'all') {
        items = items.filter(t => t.time_band === activeBand);
      }

      document.getElementById('listCountLabel').innerText = `${items.length}便 表示中`;

      const container = document.getElementById('timetableContainer');
      if (items.length === 0) {
        container.innerHTML = `
          <div class="py-16 px-4 text-center text-slate-500">
            <p class="text-base md:text-lg font-bold text-slate-700">条件に合う列車がありません</p>
            <p class="text-xs md:text-sm mt-1.5">「快速のみ」をオフにするか、別の時間帯を選択してください。</p>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map((t, idx) => {
        const isRapid = t.type_badge === '快速';
        const isSect = t.type_badge === '区間快速';
        const isSelected = selectedTrainNo === t.no;

        // 813系 種別バッジ (快速=赤幕 / 区快=黄色幕 / 普通=黒幕) - シルバー背景でクッキリ目立つ配色
        let badge = '';
        if (isRapid) {
          badge = '<span class="px-1.5 md:px-2 py-0.5 rounded font-black bg-red-600 text-white text-[10px] md:text-xs tracking-tight shadow-sm border border-red-700">快速</span>';
        } else if (isSect) {
          badge = '<span class="px-1.5 md:px-2 py-0.5 rounded font-black bg-amber-400 text-zinc-950 text-[10px] md:text-xs tracking-tight shadow-sm border border-amber-500">区快</span>';
        } else {
          badge = '<span class="px-1.5 md:px-2 py-0.5 rounded font-bold bg-zinc-800 text-white text-[10px] md:text-xs border border-zinc-900 shadow-sm">普通</span>';
        }

        // 鳥栖 表示 (乗換は813系ドア注意色イエローでハイライト)
        const tosuHtml = t.is_transfer
          ? `<div class="flex items-center justify-center gap-0.5 md:gap-1 font-mono text-[10.5px] sm:text-xs md:text-sm lg:text-base text-amber-800 font-bold">
               <span>${t.tosu_arr}</span>
               <span class="text-[8px] md:text-[10px] px-1 md:px-1.5 py-0.2 rounded font-black bg-amber-400 text-zinc-950 font-sans shadow-sm border border-amber-500">換</span>
               <span>${t.tosu_dep}</span>
             </div>`
          : `<div class="flex items-center justify-center gap-1 font-mono text-[11px] sm:text-xs md:text-sm lg:text-base text-slate-700 font-semibold">
               <span>${t.tosu_arr}</span>
               <span class="opacity-40 text-[9px] md:text-xs">/</span>
               <span>${t.tosu_dep}</span>
             </div>`;

        // 右側 行先・乗換補足
        const rightSub = t.is_transfer
          ? `<div class="text-[9.5px] sm:text-[11px] md:text-xs text-amber-800 font-bold truncate">鳥栖で乗換</div>`
          : `<div class="text-[9.5px] sm:text-[11px] md:text-xs text-slate-600 font-medium truncate">${t.dest}行</div>`;

        // 詳細カード (813系 赤いドアラインを思わせる左アクセント)
        const detailCard = isSelected ? `
          <div class="mt-2 p-3 md:p-4 rounded-xl md:rounded-2xl bg-white border-l-4 border-l-red-600 border border-slate-300 space-y-1.5 md:space-y-2 text-[11px] sm:text-xs md:text-sm text-slate-800 shadow-md">
            <div class="flex items-center justify-between border-b border-slate-200 pb-1 md:pb-1.5">
              <span class="text-slate-500 font-medium">運行日:</span>
              <span class="font-bold text-emerald-700">毎日運転（土休日も平日と同一ダイヤ）</span>
            </div>
            <div class="flex items-center justify-between border-b border-slate-200 pb-1 md:pb-1.5">
              <span class="text-slate-500 font-medium">始発駅・終点:</span>
              <span class="font-bold text-slate-900">${t.origin}駅 始発 ➔ ${t.dest}行</span>
            </div>
            <div class="flex items-center justify-between border-b border-slate-200 pb-1 md:pb-1.5">
              <span class="text-slate-500 font-medium">種別詳細:</span>
              <span class="font-bold text-red-600">${t.type_badge}（${t.note || t.dest + '行'}）</span>
            </div>
            ${t.is_transfer ? `
            <div class="p-2 md:p-2.5 rounded-lg md:rounded-xl bg-amber-50 border border-amber-300 text-[11px] sm:text-xs md:text-sm text-amber-950 leading-relaxed font-medium">
              ⚡ <strong class="text-amber-800">鳥栖駅乗り継ぎ:</strong> 博多発便は鳥栖止まりです。鳥栖駅<strong>${t.tosu_arr}着</strong>後、向かいホーム等の<strong>${t.tosu_dep}発 ${t.transfer_info.replace('鳥栖乗換 ', '')}</strong>へスムーズに乗り継ぎ、久留米駅<strong>${t.kurume_arr}着</strong>となります。
            </div>` : `
            <div class="p-2 md:p-2.5 rounded-lg md:rounded-xl bg-red-50 border border-red-200 text-[11px] sm:text-xs md:text-sm text-red-950 leading-relaxed font-medium">
              🚆 <strong class="text-red-700">久留米まで直通運転:</strong> 鳥栖駅での乗り換えなしで、久留米駅まで直通運行します。
            </div>`}
          </div>
        ` : '';

        // ステンレスシルバー調の行（ゼブラパターン + ホバー時の光沢ホワイト）
        const zebraBg = idx % 2 === 0 ? 'bg-[#edf2f7]/90' : 'bg-[#e2e8f0]/90';

        return `
          <div class="px-3 sm:px-5 md:px-6 py-2 md:py-2.5 ${zebraBg} hover:bg-white transition cursor-pointer select-none border-b border-slate-300/80" onclick="toggleRow(${t.no})">
            <div class="grid grid-cols-12 items-center">
              <!-- 始発駅 (濃いチャコールブラック) -->
              <div class="col-span-2">
                <span class="font-bold text-[11px] sm:text-xs md:text-sm lg:text-base text-slate-800 truncate block">${t.origin}</span>
              </div>

              <!-- 博多発 (813 Red - ステンレス地に映える鮮烈な赤) -->
              <div class="col-span-2 text-center">
                <span class="text-[14px] sm:text-base md:text-lg lg:text-xl font-black font-mono text-red-600 tracking-tight drop-shadow-sm">${t.hakata_dep}</span>
              </div>

              <!-- 鳥栖 (着/発) -->
              <div class="col-span-3 text-center">
                ${tosuHtml}
              </div>

              <!-- 久留米着 (深みのあるエメラルドグリーン) -->
              <div class="col-span-2 text-center">
                <span class="text-[14px] sm:text-base md:text-lg lg:text-xl font-black font-mono text-emerald-700 tracking-tight">${t.kurume_arr}</span>
              </div>

              <!-- 種別・所要時間 -->
              <div class="col-span-3 flex flex-col items-end">
                <div class="flex items-center gap-1 md:gap-1.5">
                  ${badge}
                  <span class="text-[11px] sm:text-xs md:text-sm lg:text-base font-black font-mono text-slate-900">${t.travel_time}分</span>
                </div>
                ${rightSub}
              </div>
            </div>
            ${detailCard}
          </div>
        `;
      }).join('');
    }

    // Initialize to current time band
    activeBand = detectBand();
    render();
  </script>
</body>
</html>
